name: Build SentinelWatch Android APK

on:
  workflow_dispatch: # Permet de déclencher la génération manuellement en 1 clic
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Téléchargement des dépendances
        working-directory: ./mobile
        run: flutter pub get

      - name: Compilation de l'APK Android (Release)
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Téléversement de l'APK en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-watch-mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
